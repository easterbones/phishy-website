<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishy Home - Arreda la tua Casa</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: #fff; touch-action: none; }
        #ui {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 220px;
        }
        button, select, input[type="color"] {
            background: #ff4757; color: white; border: none; padding: 8px 12px;
            margin: 4px 0; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;
            box-sizing: border-box;
        }
        button:hover { background: #ff6b81; }
        select { background: #2f3542; }
        input[type="color"] { height: 35px; padding: 2px; background: #2f3542; }
        .view-btn { background: #2ed573; }
        .view-btn:hover { background: #26af5f; }
        .center-btn { background: #1e90ff; }
        .center-btn:hover { background: #3742fa; }
        #instructions {
            position: absolute; bottom: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 6px; font-size: 13px; pointer-events: none;
        }
    </style>
    <!-- Import Three.js e controlli via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        <h2>Arreda la tua Casa</h2>
        <label>Seleziona Oggetto:</label><br>
        <select id="itemSelect">
            <option value="Chair">Sedia</option>
            <option value="Table">Tavolo</option>
            <option value="Bed">Letto</option>
        </select>
        <button id="spawnBtn">Aggiungi Oggetto</button>
        <button id="rotateBtn">Ruota Selezionato (90°)</button>
        <hr style="border:0; border-top:1px solid #444; margin:8px 0;">
        <label>Colore Muri:</label>
        <input type="color" id="wallColorPicker" value="#ffffff">
        <hr style="border:0; border-top:1px solid #444; margin:8px 0;">
        <button id="centerBtn" class="center-btn">Ricentra Telecamera</button>
        <button id="topViewBtn" class="view-btn">Vista dall'Alto</button>
        <button id="view3dBtn" class="view-btn">Vista 3D</button>
        <hr style="border:0; border-top:1px solid #444; margin:8px 0;">
        <button id="saveBtn">Salva Casa</button>
    </div>

    <div id="instructions">
        💡 <b>Comandi:</b> Trascina con il tasto sinistro per spostarti sugli assi. Usa il tasto destro (o 2 dita) per ruotare. Trascina i mobili per posizionarli.
    </div>

    <script>
        const API_BASE_URL = "https://phishy-websites.onrender.com";

        const urlParams = new URLSearchParams(window.location.search);
        let numero = urlParams.get('numero') || urlParams.get('phone');
        if (!numero) {
            const rawSearch = window.location.search.replace('?', '');
            numero = rawSearch.replace(/[^0-9]/g, '');
        }
        if (!numero) {
            numero = prompt("Inserisci il tuo numero di telefono (es. 393331234567):") || "390000000000";
        }
        numero = numero.replace(/[^0-9]/g, '');

        let scene, camera, renderer, controls;
        const placedObjects = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let roomBounds;
        let wallMaterial;
        
        let selectedObject = null;
        let isDragging = false;
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let lastValidPosition = new THREE.Vector3();
        let lastValidRotation = 0;

        const assetPaths = {
            "Chair": "public/furniture/Chair_17.glb",
            "Table": "public/furniture/Work_Table_06.glb",
            "Bed": "public/furniture/Bed_02.glb"
        };

        init();
        loadUserHouse();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // OrbitControls configurati per spostamento libero con tasto sinistro e rotazione con tasto destro
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = true;
            controls.enableRotate = true;
            controls.enableZoom = true;

            // Rimappatura controlli: Sinistro = Pan (Spostamento), Destro = Rotate (Rotazione)
            controls.mouseButtons = {
                LEFT: THREE.MOUSE.PAN,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.ROTATE
            };
            controls.touches = {
                ONE: THREE.TOUCH.PAN,
                TWO: THREE.TOUCH.DOLLY_ROTATE
            };

            // Luci
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Caricamento Texture Pavimento da public/furniture/pavimento.png
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const textureLoader = new THREE.TextureLoader();
            
            const floorTexture = textureLoader.load('public/furniture/pavimento.png', (texture) => {
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(4, 4);
            });

            const floorMat = new THREE.MeshStandardMaterial({ 
                map: floorTexture, 
                roughness: 0.8 
            });

            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.name = "floor";
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Creazione dei Due Muri ad Angolo (Posteriore e Sinistro)
            wallMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });

            const backWallGeo = new THREE.BoxGeometry(10, 3, 0.2);
            const backWall = new THREE.Mesh(backWallGeo, wallMaterial);
            backWall.position.set(0, 1.5, -5.1);
            scene.add(backWall);

            const leftWallGeo = new THREE.BoxGeometry(0.2, 3, 10);
            const leftWall = new THREE.Mesh(leftWallGeo, wallMaterial);
            leftWall.position.set(-5.1, 1.5, 0);
            scene.add(leftWall);

            roomBounds = { minX: -4.8, maxX: 4.8, minZ: -4.8, maxZ: 4.8 };

            // Gestione cambio colore muri tramite Color Picker
            document.getElementById('wallColorPicker').addEventListener('input', (e) => {
                if (wallMaterial) {
                    wallMaterial.color.set(e.target.value);
                }
            });

            // Eventi di puntamento per il trascinamento diretto degli oggetti
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);

            // Pulsanti UI per la gestione della telecamera
            document.getElementById('centerBtn').addEventListener('click', () => {
                controls.target.set(0, 0, 0);
                camera.position.set(0, 10, 12);
                controls.update();
            });

            document.getElementById('topViewBtn').addEventListener('click', () => {
                controls.target.set(0, 0, 0);
                camera.position.set(0, 15, 0.001);
                controls.update();
            });

            document.getElementById('view3dBtn').addEventListener('click', () => {
                controls.target.set(0, 0, 0);
                camera.position.set(0, 10, 12);
                controls.update();
            });

            document.getElementById('spawnBtn').addEventListener('click', () => {
                const type = document.getElementById('itemSelect').value;
                spawnItem(type, 0, 0, 0, null, true);
            });

            document.getElementById('rotateBtn').addEventListener('click', () => {
                if (selectedObject) {
                    lastValidPosition.copy(selectedObject.position);
                    lastValidRotation = selectedObject.rotation.y;
                    
                    selectedObject.rotation.y += Math.PI / 2;
                    
                    const activeItem = placedObjects.find(i => i.mesh === selectedObject);
                    if (activeItem) {
                        clampToBounds(selectedObject, activeItem.box);
                        if (checkObjectCollisions(activeItem)) {
                            selectedObject.rotation.y = lastValidRotation;
                            clampToBounds(selectedObject, activeItem.box);
                            alert("⚠️ Rotazione non consentita: collisione con un altro oggetto!");
                        }
                    }
                }
            });

            document.getElementById('saveBtn').addEventListener('click', saveUserHouse);
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function clampToBounds(obj, box) {
            box.setFromObject(obj);
            
            const minMarginX = obj.position.x - box.min.x;
            const maxMarginX = box.max.x - obj.position.x;
            const minMarginZ = obj.position.z - box.min.z;
            const maxMarginZ = box.max.z - obj.position.z;

            const allowedMinX = roomBounds.minX + minMarginX;
            const allowedMaxX = roomBounds.maxX - maxMarginX;
            const allowedMinZ = roomBounds.minZ + minMarginZ;
            const allowedMaxZ = roomBounds.maxZ - maxMarginZ;

            obj.position.x = Math.max(allowedMinX, Math.min(allowedMaxX, obj.position.x));
            obj.position.z = Math.max(allowedMinZ, Math.min(allowedMaxZ, obj.position.z));
            obj.position.y = 0;

            box.setFromObject(obj);
        }

        function spawnItem(type, x, z, rotY = 0, customId = null, autoSelect = false) {
            const loader = new THREE.GLTFLoader();
            const path = assetPaths[type] || assetPaths["Chair"];

            loader.load(path, (gltf) => {
                const obj = gltf.scene;
                obj.scale.set(1.5, 1.5, 1.5);
                obj.position.set(x, 0, z);
                obj.rotation.y = rotY;

                const box = new THREE.Box3().setFromObject(obj);
                
                const itemData = {
                    id: customId || 'item_' + Date.now(),
                    modelName: type,
                    mesh: obj,
                    box: box
                };

                clampToBounds(obj, box);

                let attempts = 0;
                while (checkObjectCollisions(itemData) && attempts < 5) {
                    obj.position.x += 0.8;
                    clampToBounds(obj, box);
                    attempts++;
                }

                scene.add(obj);
                placedObjects.push(itemData);

                if (autoSelect) {
                    selectedObject = obj;
                }
            }, undefined, (error) => {
                console.error("Errore caricamento modello glb:", error);
            });
        }

        function onPointerDown(event) {
            if (event.clientX < 260 && event.clientY < 480) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const meshes = placedObjects.map(i => i.mesh);
            const intersects = raycaster.intersectObjects(meshes, true);

            if (intersects.length > 0) {
                let clickedRoot = intersects[0].object;
                while (clickedRoot.parent && clickedRoot.parent !== scene) {
                    clickedRoot = clickedRoot.parent;
                }
                selectedObject = clickedRoot;
                isDragging = true;
                controls.enabled = false; // Disabilita temporaneamente la camera per trascinare l'oggetto

                const activeItem = placedObjects.find(i => i.mesh === selectedObject);
                if (activeItem) {
                    lastValidPosition.copy(selectedObject.position);
                    lastValidRotation = selectedObject.rotation.y;
                }
            }
        }

        function onPointerMove(event) {
            if (!isDragging || !selectedObject) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, targetPos);

            if (targetPos) {
                selectedObject.position.x = targetPos.x;
                selectedObject.position.z = targetPos.z;
                selectedObject.position.y = 0;

                const activeItem = placedObjects.find(i => i.mesh === selectedObject);
                if (activeItem) {
                    clampToBounds(selectedObject, activeItem.box);
                }
            }
        }

        function onPointerUp(event) {
            if (!isDragging) return;
            isDragging = false;
            controls.enabled = true; // Riabilita la telecamera

            if (selectedObject) {
                const activeItem = placedObjects.find(i => i.mesh === selectedObject);
                if (activeItem) {
                    activeItem.box.setFromObject(selectedObject);
                    if (checkObjectCollisions(activeItem)) {
                        alert("⚠️ Spazio occupato da un altro oggetto!");
                        selectedObject.position.copy(lastValidPosition);
                        selectedObject.rotation.y = lastValidRotation;
                        activeItem.box.setFromObject(selectedObject);
                    }
                }
            }
        }

        function checkObjectCollisions(currentItem) {
            currentItem.box.setFromObject(currentItem.mesh);
            for (let i = 0; i < placedObjects.length; i++) {
                if (placedObjects[i].mesh !== currentItem.mesh) {
                    placedObjects[i].box.setFromObject(placedObjects[i].mesh);
                    if (currentItem.box.intersectsBox(placedObjects[i].box)) {
                        return true;
                    }
                }
            }
            return false;
        }

        async function loadUserHouse() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/house/${numero}`);
                const data = await res.json();
                if (data.success && data.house && Array.isArray(data.house.furniture)) {
                    data.house.furniture.forEach(item => {
                        spawnItem(item.modelName, item.x, item.z, item.rotationY, item.id, false);
                    });
                }
            } catch (err) {
                console.error("Errore nel caricamento della casa dal DB:", err);
            }
        }

        async function saveUserHouse() {
            const furnitureData = placedObjects.map(item => ({
                id: item.id,
                modelName: item.modelName,
                x: item.mesh.position.x,
                y: 0,
                z: item.mesh.position.z,
                rotationY: item.mesh.rotation.y
            }));

            try {
                const res = await fetch(`${API_BASE_URL}/api/house/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero, houseType: 'monolocale', furniture: furnitureData })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Casa salvata con successo nel database!");
                } else {
                    alert("Errore durante il salvataggio: " + (data.message || ''));
                }
            } catch (err) {
                console.error("Errore di rete:", err);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
