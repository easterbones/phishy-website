<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerca Profilo Utente</title>
    <!-- Aggiungo Bootstrap per la grafica di base -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 50px;
        }
        .profile-card {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Cerca Profilo Bot</h2>
    
    <div class="input-group mb-3">
        <input type="text" id="numeroInput" class="form-control" placeholder="Inserisci il numero (es. 393401234567)">
        <button id="btnCerca" class="btn btn-secondary">Cerca</button>
    </div>

    <!-- Messaggio di Errore -->
    <div id="errorMsg" class="alert alert-danger" style="display: none; text-align: center;"></div>

    <!-- Risultati Profilo -->
    <div id="profileResult" class="profile-card" style="display: none;">
        <h3 id="pName" class="text-center mb-3">👤 Utente</h3>
        <ul class="list-group list-group-flush">
            <li class="list-group-item bg-transparent border-dark"><strong>Livello:</strong> <span id="pLevel"></span></li>
            <li class="list-group-item bg-transparent border-dark"><strong>Ruolo:</strong> <span id="pRole"></span></li>
            <li class="list-group-item bg-transparent border-dark"><strong>Salute:</strong> <span id="pHealth"></span></li>
            <li class="list-group-item bg-transparent border-dark"><strong>Vita:</strong> <span id="pVita"></span></li>
            <li class="list-group-item bg-transparent border-dark"><strong>Limite:</strong> <span id="pLimit"></span></li>
            <li class="list-group-item bg-transparent border-dark"><strong>Credito:</strong> <span id="pCredito"></span></li>
            <li class="list-group-item bg-transparent border-dark"><strong>Join:</strong> <span id="pJoin"></span></li>
            <li class="list-group-item bg-transparent border-dark"><strong>Esperienza:</strong> <span id="pExp"></span></li>
        </ul>
    </div>
</div>

<!-- Collegamento al file JavaScript -->
<script src="/profilo-web.js"></script>

</body>
</html>
