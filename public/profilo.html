<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilo Phishy</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@1,700;1,800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#f5efdc;--gold:#c9a24b;--rose:#c27c8a;--dark:#1a1210;--teal:#00c2cb;--mag:#ff2bd6;--yel:#ffe600;--vio:#5b3bff;--ore:#ff5a1f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:500 1rem 'Space Grotesk',system-ui,sans-serif;color:var(--ink);overflow-x:hidden;
 background:radial-gradient(circle at 15% 8%,rgba(255,43,214,.28),transparent 40%),radial-gradient(circle at 85% 65%,rgba(0,194,203,.22),transparent 42%),var(--dark)}
body::before{content:"XII";position:fixed;inset:0;display:grid;place-items:center;font:italic 800 min(60vw,520px)/1 'Playfair Display',serif;color:rgba(201,162,75,.07);pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(#000 22%,transparent 24%) 0 0/9px 9px;opacity:.28;pointer-events:none;z-index:0}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:miter;stroke-linecap:square;vertical-align:-.2em;flex:none}
.tape{position:relative;z-index:2;background:var(--yel);border-block:4px solid #000;overflow:hidden;white-space:nowrap;font:900 .95rem 'Archivo Black',sans-serif;text-transform:uppercase;transform:rotate(-1deg) scale(1.03);margin-top:10px;box-shadow:0 6px 0 #000}
.marq{display:inline-flex;gap:22px;padding:8px 0;animation:marq 22s linear infinite}.marq span{display:inline-flex;align-items:center;gap:22px}
@keyframes marq{to{transform:translateX(-50%)}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:30px 18px 70px}
.mast{position:relative;padding:26px 8px 18px;min-height:230px}
.mast h1{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.mast h1 span{font:400 clamp(3rem,13vw,7.5rem)/.95 'Archivo Black',sans-serif;padding:0 .08em;border:4px solid #000;box-shadow:6px 6px 0 #000;animation:wig 3s ease-in-out infinite;animation-delay:calc(var(--k)*-.4s)}
.mast h1 span:nth-child(4n+1){background:var(--mag);transform:rotate(-3deg)}.mast h1 span:nth-child(4n+2){background:var(--paper);transform:rotate(2deg)}
.mast h1 span:nth-child(4n+3){background:var(--teal);transform:rotate(-1deg)}.mast h1 span:nth-child(4n){background:var(--yel);transform:rotate(3deg)}
@keyframes wig{50%{translate:0 -7px}}
.sub{font:italic 700 clamp(1.1rem,3vw,1.6rem)/1.2 'Playfair Display',serif;color:var(--gold);margin:16px 4px 0;display:flex;align-items:center;gap:12px}
.stk{position:absolute;border:4px solid #000;box-shadow:7px 7px 0 #000;background:#fff;object-fit:cover;aspect-ratio:3/2;animation:wig 4s ease-in-out infinite}
.s1{width:min(300px,38vw);right:0;top:6px;rotate:4deg}.s2{width:min(170px,26vw);right:32%;bottom:-46px;rotate:-6deg;animation-delay:-1.5s}
.search{position:relative;z-index:3;display:flex;gap:12px;margin-top:58px;padding:14px;background:var(--paper);border:4px solid #000;box-shadow:8px 8px 0 #000;outline:2px solid var(--gold);outline-offset:-10px}
.search input{flex:1;min-width:0;font:700 1.15rem 'Space Grotesk';padding:14px 16px;border:4px solid #000;background:#fff;outline:0}
.search input:focus,.btn:focus-visible{outline:4px solid var(--vio);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:400 1.1rem 'Archivo Black';text-transform:uppercase;padding:0 26px;border:4px solid #000;background:var(--yel);box-shadow:5px 5px 0 #000;transition:.12s}
.btn:hover{translate:3px 3px;box-shadow:2px 2px 0 #000;background:var(--mag)}.btn:active{translate:5px 5px;box-shadow:0 0 0 #000}
.err{margin-top:22px;padding:16px 20px;background:var(--mag);border:4px solid #000;box-shadow:7px 7px 0 #000;font:900 1.1rem 'Archivo Black';display:flex;gap:12px;align-items:center;animation:pop .5s backwards}
.loader{display:flex;gap:12px;justify-content:center;margin:44px}.loader i{width:30px;height:30px;border:4px solid #000;background:var(--teal);animation:hop .7s infinite}
.loader i:nth-child(2){background:var(--mag);animation-delay:.12s}.loader i:nth-child(3){background:var(--yel);animation-delay:.24s}
@keyframes hop{50%{translate:0 -24px;rotate:90deg}}
@keyframes pop{0%{opacity:0;transform:translateY(30px) rotate(var(--r,0deg)) scale(.85)}100%{opacity:1}}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i,0)*60ms)}
[hidden]{display:none!important}
.card{position:relative;background:var(--paper);border:4px solid #000;box-shadow:8px 8px 0 #000;outline:2px solid var(--gold);outline-offset:-10px}
.hero{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:26px;padding:28px;margin-top:34px}
.por{position:relative;align-self:start;rotate:-2deg}.por img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border:4px solid #000;box-shadow:6px 6px 0 var(--mag)}
.seal{position:absolute;right:-26px;bottom:-34px;width:104px;height:104px;border-radius:50%;display:grid;place-content:center;text-align:center;color:#fff7e6;border:4px solid #000;box-shadow:5px 5px 0 #000,inset 0 0 0 5px var(--rose),inset 0 0 0 8px var(--gold);background:radial-gradient(circle at 35% 30%,#e3a3b0,var(--rose) 60%,#8f4a58);rotate:8deg}
.seal b{font:italic 800 1.7rem/1 'Playfair Display',serif}.seal small{font:700 .55rem 'Space Grotesk';letter-spacing:.15em}
.name{font:400 clamp(1.9rem,5vw,3.4rem)/1 'Archivo Black';margin:0 0 10px;word-break:break-word;text-shadow:4px 4px 0 var(--teal)}
.meta{font:italic 700 1.2rem 'Playfair Display',serif;color:#6a4a3a;margin:0 0 14px}
.badges{display:flex;flex-wrap:wrap;gap:8px}.bd{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:3px solid #000;background:#fff;font:700 .85rem 'Space Grotesk';text-transform:uppercase;box-shadow:3px 3px 0 #000}
.bd.ok{background:var(--teal)}.bd.bad{background:var(--mag)}.bd.gold{background:var(--yel)}
.vital{margin-top:20px}.vital>div:first-child{display:flex;justify-content:space-between;font:900 1rem 'Archivo Black';text-transform:uppercase;margin-bottom:6px}
.bar{height:40px;border:4px solid #000;background:#fff;position:relative;box-shadow:4px 4px 0 #000}
.fill{height:100%;width:0;border-right:4px solid #000;transition:width 1.4s cubic-bezier(.3,1.2,.5,1);
 background:linear-gradient(135deg,var(--rose) 25%,transparent 25%) 12px 0/24px 24px,linear-gradient(225deg,var(--rose) 25%,transparent 25%) 12px 0/24px 24px,linear-gradient(45deg,var(--rose) 25%,transparent 25%) 0 0/24px 24px,linear-gradient(315deg,var(--rose) 25%,#f3e6c8 25%) 0 0/24px 24px}
.pct{position:absolute;right:-4px;top:-30px;background:#000;color:var(--yel);font:900 .85rem 'Archivo Black';padding:3px 9px}
.rib{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:44px 0 20px;padding:10px 22px;background:var(--rose);border-block:4px solid #000;box-shadow:0 7px 0 #000;color:#fff7e6;font:italic 800 clamp(1.4rem,4vw,2rem)/1 'Playfair Display',serif;rotate:-.7deg;outline:2px solid var(--gold);outline-offset:-9px}
.rib>span{display:flex;align-items:center;gap:12px}
.cnt{background:#000;color:var(--gold);border:3px solid var(--gold);padding:4px 14px;font:italic 700 1.1rem 'Playfair Display',serif;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}
.tile{position:relative;padding:20px 16px 16px;background:var(--b);border:4px solid #000;box-shadow:7px 7px 0 #000;outline:2px solid rgba(0,0,0,.35);outline-offset:-10px;transition:.12s;cursor:default}
.tile:hover{translate:4px 4px;box-shadow:3px 3px 0 #000}
.tile:nth-child(odd){rotate:-.8deg}.tile:nth-child(even){rotate:.8deg}
.t1{--b:var(--teal)}.t2{--b:var(--mag)}.t3{--b:var(--yel)}.t4{--b:var(--paper)}.t5{--b:var(--vio);color:#fff}.t6{--b:var(--ore)}
.ico{width:46px;height:46px;display:grid;place-items:center;background:#000;color:var(--yel);margin-bottom:12px;font-size:1.5rem;border:3px solid #000;box-shadow:3px 3px 0 rgba(255,255,255,.7)}
.tile b{display:block;font:400 clamp(1.5rem,3.2vw,2.1rem)/1 'Archivo Black';word-break:break-word}
.tile span{font:italic 700 1.05rem 'Playfair Display',serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.panel{padding:0 0 14px}.panel .band{display:block;width:100%;height:120px;object-fit:cover;border-bottom:4px solid #000}.panel .in{padding:8px 24px 0}
.sw,.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;font-weight:700}
.sw+.sw,.row+.row{border-top:3px dashed #000}.sw>span,.row>span{display:flex;gap:8px;align-items:center;text-transform:uppercase;font-size:.85rem}
.row b{text-align:right;word-break:break-word;font-weight:700}
.tg{width:62px;height:32px;border:4px solid #000;background:#000;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--paper);transition:.35s cubic-bezier(.3,1.6,.5,1)}
.tg.on{background:var(--yel)}.tg.on.red{background:var(--mag)}.tg.on::after{translate:30px 0;background:#000}
.note{display:flex;gap:18px;align-items:center;padding:16px 20px;margin-top:26px;background:var(--yel);border:4px solid #000;box-shadow:7px 7px 0 #000;font-weight:700;rotate:.5deg}
.note img{width:130px;flex:none;aspect-ratio:3/2;object-fit:cover;border:4px solid #000;image-rendering:pixelated}
.gband{display:block;width:100%;height:150px;object-fit:cover;border:4px solid #000;box-shadow:7px 7px 0 #000;margin-bottom:22px;filter:contrast(1.1)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.g{padding:20px}.g h4{margin:0 0 12px;font:400 1.1rem 'Archivo Black';display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:4px 10px;border:3px solid #000;background:#fff;font:700 .8rem 'Space Grotesk'}
.empty{padding:26px;text-align:center;font:italic 700 1.3rem 'Playfair Display',serif}

/* =========================================
   MOBILE OPTIMIZATION (Vertical Phone)
   ========================================= */
@media (max-width: 768px) {
    body { font-size: 14px; }
    .wrap { padding: 15px 10px 50px; }
    
    /* Masthead */
    .mast { min-height: auto; padding: 15px 5px; text-align: center; }
    .mast h1 { justify-content: center; gap: 4px; }
    .mast h1 span { font-size: clamp(2rem, 10vw, 3.5rem); padding: 0 0.05em; border-width: 3px; box-shadow: 3px 3px 0 #000; }
    .sub { font-size: 0.95rem; justify-content: center; margin-top: 10px; }
    .stk { display: none; } /* Hide floating images to save space */

    /* Search Bar */
    .search { margin-top: 20px; padding: 10px; flex-direction: column; gap: 10px; box-shadow: 4px 4px 0 #000; outline-offset: -6px; }
    .search input { font-size: 1rem; padding: 12px; border-width: 3px; }
    .btn { width: 100%; padding: 12px; font-size: 1rem; justify-content: center; box-shadow: 3px 3px 0 #000; border-width: 3px; }

    /* Hero Profile Card */
    .hero { grid-template-columns: 1fr; padding: 15px; gap: 15px; margin-top: 20px; box-shadow: 5px 5px 0 #000; outline-offset: -6px; }
    .por { max-width: 100%; width: 100%; rotate: 0deg; margin: 0 auto; }
    .por img { box-shadow: 3px 3px 0 var(--mag); border-width: 3px; }
    .seal { width: 85px; height: 85px; right: 5px; bottom: -15px; border-width: 3px; box-shadow: 3px 3px 0 #000, inset 0 0 0 4px var(--rose), inset 0 0 0 6px var(--gold); }
    .seal b { font-size: 1.4rem; }
    .seal small { font-size: 0.45rem; }
    
    .name { font-size: clamp(1.8rem, 8vw, 2.5rem); text-align: center; text-shadow: 3px 3px 0 var(--teal); margin-top: 10px; }
    .meta { font-size: 1rem; text-align: center; margin-bottom: 10px; }
    .badges { justify-content: center; gap: 5px; }
    .bd { font-size: 0.65rem; padding: 4px 8px; border-width: 2px; box-shadow: 2px 2px 0 #000; }
    
    /* Vital Bar */
    .vital { margin-top: 15px; }
    .vital > div:first-child { font-size: 0.85rem; }
    .bar { height: 30px; border-width: 3px; box-shadow: 3px 3px 0 #000; }
    .pct { font-size: 0.75rem; padding: 2px 6px; top: -25px; }

    /* Ribbons (Section Headers) */
    .rib { padding: 8px 15px; font-size: 1.1rem; margin: 30px 0 15px; rotate: 0deg; box-shadow: 0 4px 0 #000; outline-offset: -5px; }
    .cnt { font-size: 0.8rem; padding: 3px 8px; border-width: 2px; }

    /* Stats Grid */
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tile { padding: 12px 10px; box-shadow: 4px 4px 0 #000; outline-offset: -6px; rotate: 0deg !important; }
    .tile:hover { translate: 2px 2px; box-shadow: 2px 2px 0 #000; }
    .ico { width: 32px; height: 32px; font-size: 1.1rem; margin-bottom: 8px; border-width: 2px; box-shadow: 2px 2px 0 rgba(255,255,255,.7); }
    .tile b { font-size: 1.3rem; margin-bottom: 4px; }
    .tile span { font-size: 0.8rem; }

    /* Dossier Section */
    .two { grid-template-columns: 1fr; gap: 15px; }
    .panel { padding: 0 0 10px; box-shadow: 5px 5px 0 #000; outline-offset: -6px; }
    .panel .band { height: 80px; }
    .panel .in { padding: 5px 15px 0; }
    .sw, .row { padding: 10px 0; font-size: 0.8rem; }
    .sw > span, .row > span { font-size: 0.75rem; gap: 4px; }
    .row b { font-size: 0.85rem; }
    
    /* Toggle Switch */
    .tg { width: 48px; height: 26px; border-width: 3px; }
    .tg::after { width: 16px; height: 16px; top: 2px; left: 2px; }
    .tg.on::after { translate: 22px 0; }

    /* Note Box */
    .note { flex-direction: column; text-align: center; padding: 15px; gap: 12px; box-shadow: 4px 4px 0 #000; rotate: 0deg; font-size: 0.9rem; }
    .note img { width: 100%; max-width: 150px; }

    /* Groups Section */
    .gband { height: 100px; margin-bottom: 15px; box-shadow: 4px 4px 0 #000; }
    .groups { grid-template-columns: 1fr; gap: 15px; }
    .g { padding: 15px; box-shadow: 4px 4px 0 #000; outline-offset: -6px; }
    .g h4 { font-size: 1rem; margin-bottom: 8px; }
    .chips { gap: 5px; }
    .chip { font-size: 0.7rem; padding: 3px 6px; border-width: 2px; }
    
    /* Loader */
    .loader { margin: 30px; gap: 8px; }
    .loader i { width: 20px; height: 20px; border-width: 3px; }
}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
