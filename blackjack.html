<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack · Phishy</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@1,700;1,800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5efdc;--gold:#c9a24b;--rose:#c27c8a;--dark:#1a1210;--teal:#00c2cb;--mag:#ff2bd6;--yel:#ffe600;--vio:#5b3bff;--ore:#ff5a1f;--green:#2ecc71;--red:#e74c3c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding-bottom:40px;font:500 1rem 'Space Grotesk',system-ui,sans-serif;color:#000;overflow-x:hidden;
 background:radial-gradient(circle at 15% 8%,rgba(255,43,214,.28),transparent 40%),radial-gradient(circle at 85% 65%,rgba(0,194,203,.22),transparent 42%),var(--dark)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(#000 22%,transparent 24%) 0 0/9px 9px;opacity:.28;pointer-events:none}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linejoin:miter;stroke-linecap:square;vertical-align:-.2em;flex:none}
.wrap{position:relative;max-width:960px;margin:0 auto;padding:26px 16px}
.top{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
h1{margin:0;display:flex;gap:5px;flex-wrap:wrap}
h1 span{font:400 clamp(1.8rem,7vw,3.6rem)/1 'Archivo Black';padding:0 .08em;border:4px solid #000;box-shadow:5px 5px 0 #000;animation:wig 3s ease-in-out infinite;animation-delay:calc(var(--k)*-.4s)}
h1 span:nth-child(4n+1){background:var(--mag);rotate:-3deg}h1 span:nth-child(4n+2){background:var(--paper);rotate:2deg}h1 span:nth-child(4n+3){background:var(--teal);rotate:-1deg}h1 span:nth-child(4n){background:var(--yel);rotate:3deg}
@keyframes wig{50%{translate:0 -6px}}
.wallet{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--paper);border:4px solid #000;box-shadow:4px 4px 0 #000;font:400 1rem 'Archivo Black'}
.chip small{font:700 .7rem 'Space Grotesk';text-transform:uppercase;opacity:.7}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{padding:8px 14px;background:var(--paper);border:3px solid #000;box-shadow:3px 3px 0 #000;font:700 .85rem 'Space Grotesk';text-transform:uppercase}
.stat b{font:400 1.1rem 'Archivo Black';display:block}
.stat.win b{color:var(--green)}.stat.loss b{color:var(--red)}.stat.push b{color:var(--vio)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:400 1rem 'Archivo Black';text-transform:uppercase;padding:10px 20px;border:4px solid #000;background:var(--yel);color:#000;box-shadow:5px 5px 0 #000;transition:.12s}
.btn:hover:not(:disabled){translate:3px 3px;box-shadow:2px 2px 0 #000;background:var(--mag)}.btn:active:not(:disabled){translate:5px 5px;box-shadow:0 0 0}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:var(--paper)}.btn.teal{background:var(--teal)}.btn.mag{background:var(--mag);color:#fff}.btn.green{background:var(--green)}.btn.red{background:var(--red);color:#fff}
.btn:focus-visible{outline:4px solid var(--vio);outline-offset:2px}

.card{position:relative;background:var(--paper);border:4px solid #000;box-shadow:7px 7px 0 #000;outline:2px solid var(--gold);outline-offset:-10px;padding:20px}
.table{margin-top:28px;display:flex;flex-direction:column;gap:22px}
.hand{min-height:140px}
.hand-label{font:italic 800 1.2rem 'Playfair Display',serif;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.hand-label .score{background:#000;color:var(--gold);border:2px solid var(--gold);padding:2px 10px;font:italic 700 .95rem 'Playfair Display'}
.cards{display:flex;flex-wrap:wrap;gap:10px;min-height:110px;align-items:flex-start}
.playing-card{
  width:72px;height:100px;border:3px solid #000;border-radius:8px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:400 1.4rem 'Archivo Black';box-shadow:4px 4px 0 rgba(0,0,0,.35);
  position:relative;animation:deal .35s cubic-bezier(.2,.8,.3,1) backwards;
}
.playing-card.red{color:#c0392b}
.playing-card.black{color:#1a1210}
.playing-card.back{
  background:repeating-linear-gradient(45deg,#1a1210 0 4px,var(--mag) 4px 8px);
  color:transparent;
}
.playing-card .suit{font-size:1.6rem;line-height:1}
.playing-card .rank{font-size:1.1rem;position:absolute;top:4px;left:6px}
@keyframes deal{0%{opacity:0;transform:translateY(-30px) scale(.8)}}

.bet-area{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.25);border:4px dashed #000}
.bet-area label{font:400 1rem 'Archivo Black'}
.bet-input{width:120px;padding:10px;border:4px solid #000;font:400 1.2rem 'Archivo Black';text-align:center;background:#fff}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.msg{padding:14px 18px;border:4px solid #000;font:400 1.1rem 'Archivo Black';text-align:center;margin-top:12px}
.msg.win{background:var(--green)}.msg.loss{background:var(--mag);color:#fff}.msg.push{background:var(--yel)}.msg.info{background:var(--teal)}
.toast{position:fixed;top:16px;left:50%;translate:-50% 0;z-index:20;max-width:92vw;padding:12px 18px;border:4px solid #000;box-shadow:6px 6px 0 #000;background:var(--teal);font:400 1rem 'Archivo Black';animation:fadeIn .4s}
.toast.bad{background:var(--mag);color:#fff}
@keyframes fadeIn{0%{opacity:0}}
.empty{padding:28px;text-align:center;font:italic 700 1.3rem 'Playfair Display',serif}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:500px){
  .playing-card{width:58px;height:82px;font-size:1.1rem}
  .playing-card .suit{font-size:1.3rem}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-candy" viewBox="0 0 24 24"><path d="M8 8h8v8H8zM8 12L2 8v8zM16 12l6-4v8z"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24"><path d="M2 5h20v14H2zM2 10h20M6 15h5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></symbol>
<symbol id="i-spade" viewBox="0 0 24 24"><path d="M12 2C8 8 4 10 4 14a4 4 0 008 0 4 4 0 008 0c0-4-4-6-8-12zM10 18h4v4h-4z"/></symbol>
</defs></svg>

<main class="wrap">
  <header class="top">
    <h1 aria-label="Blackjack"><span style="--k:1">B</span><span style="--k:2">L</span><span style="--k:3">A</span><span style="--k:4">C</span><span style="--k:5">K</span><span style="--k:6">J</span><span style="--k:7">A</span><span style="--k:8">C</span><span style="--k:9">K</span></h1>
    <div class="wallet" id="wallet"></div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="table card" id="table">
    <!-- Dealer -->
    <div class="hand" id="dealerHand">
      <div class="hand-label">Dealer <span class="score" id="dealerScore" hidden></span></div>
      <div class="cards" id="dealerCards"></div>
    </div>

    <!-- Player -->
    <div class="hand" id="playerHand">
      <div class="hand-label">Tu <span class="score" id="playerScore" hidden></span></div>
      <div class="cards" id="playerCards"></div>
    </div>

    <!-- Bet / Actions -->
    <div id="controls">
      <div class="bet-area" id="betArea">
        <label for="bet">Puntata</label>
        <input type="number" id="bet" class="bet-input" min="10" step="10" value="100">
        <button class="btn teal" id="dealBtn">Dai carte</button>
      </div>
      <div class="actions" id="actionBar" hidden>
        <button class="btn green" id="hitBtn">Hit</button>
        <button class="btn" id="standBtn">Stand</button>
        <button class="btn mag" id="doubleBtn">Raddoppia</button>
      </div>
      <div class="msg" id="resultMsg" hidden></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>
<script src="/blackjack-web.js"></script>
</body>
</html>
